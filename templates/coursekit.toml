# Course config for the course kit (course-kit/STANDARD.md).
# Check: python3 <path-to>/course-kit/tools/coursekit.py lint

[course]
code = "0000000"
name = "Course name"
language = "en"
accent = "#0f766e"

# Glob patterns relative to the course root. First match wins.
# Types: lab, event (session without the lab structure), talk, script, sop, notes.
[types]
lab = ["sessions/*/lab.md"]
talk = ["sessions/*/talk.md"]
sop = ["sessions/*/sop.md"]
notes = ["sessions/*/notes.md"]

[ignore]
paths = ["templates/**"]

# Override the standard's budgets only after the teachers agree to.
[budgets]

[talk]
minutes = 40

# One color per recurring entity, for every figure and slide (theme/course.css: c1..c8).
[palette]

# Session number = "date · toolchain · hardware" of the last full run.
[validated]
